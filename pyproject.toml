[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "1.3.0"
description = "面向科研场景的通用智能体系统 - Research Agent System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Research Agent Team"}
]

dependencies = [
    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    
    # Database
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    
    # AI/LLM
    "langgraph>=0.0.30",
    "openai>=1.12.0",
    "anthropic>=0.22.0",
    "google-genai>=1.0.0",
    
    # Bioinformatics
    "biopython>=1.83",
    "entrezpy>=1.1.0",
    "requests>=2.31.0",
    "xmltodict>=0.13.0",
    
    # Data processing
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    
    # Visualization
    "matplotlib>=3.8.0",
    "pypdf>=4.0.0",
    
    # Async
    "httpx>=0.26.0",
    "aiofiles>=23.2.1",
    
    # Configuration
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.1.0",
    "pyyaml>=6.0.1",
    
    # Security
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",
    "networkx>=3.2.0",

    # Desktop runtime
    "pywebview>=5.0",
    "pystray>=0.19.5",
    "pillow>=10.0.0",
    
    # Utilities
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "click>=8.1.0",
    "tenacity>=8.2.0",
    "packaging>=23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "black>=24.0.0",
]
postgres = [
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
]
redis = [
    "redis[hiredis]>=5.0.0",
    "celery[redis]>=5.3.0",
]

[project.scripts]
research-agent = "research_agent.cli:main"
ra = "research_agent.cli:main"
research-agent-desktop = "research_agent.desktop_app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["research_agent*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
# The formatter intentionally preserves long strings and URLs.  E501 would
# therefore conflict with `ruff format` without improving runtime safety.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's documented dependency-injection form uses Depends() defaults.
"src/research_agent/core/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
